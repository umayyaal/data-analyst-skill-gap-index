name: Refresh Job Data

on:
  schedule:
    - cron: '0 6 * * 1'  # every Monday at 6 AM UTC
  workflow_dispatch:      # allows manual trigger from GitHub's Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas python-dotenv

      - name: Run pipeline
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          python scripts/01_fetch_jobs.py
          python scripts/02_clean_data.py
          python scripts/03_load_to_db.py
          python scripts/04_export_for_dashboard.py

      - name: Commit updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ db/ dashboard/jobs.csv dashboard/jobs_skills.csv
          git diff --staged --quiet || git commit -m "Automated data refresh $(date +'%Y-%m-%d')"
          git push